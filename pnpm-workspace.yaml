packages:
  - 'apps/*'
  - 'packages/*'
  - 'plugins/*'

# Scripts d'installation explicitement autorises. Tout le reste est ignore :
# une dependance transitive ne doit pas pouvoir executer du code a l'installation
# sans decision consciente.
allowBuilds:
  esbuild: true
  # Accelerateur natif facultatif de msgpackr, utilise par BullMQ. La
  # bibliotheque retombe sur une implementation JavaScript sans lui, et le
  # gain ne justifie pas une compilation native a l'installation.
  msgpackr-extract: false
