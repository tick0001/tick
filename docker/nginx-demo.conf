# Service de l'interface pour une **demonstration publique**.
#
# Monte par compose.demo.yaml par-dessus /etc/nginx/conf.d/default.conf du
# conteneur `web`. C'est une copie de `nginx.conf`, augmentee de refus.
#
# La duplication est assumee, faute de mieux : le fichier de base est cuit dans
# l'image publiee, et on ne peut donc pas y ajouter un point d'extension sans
# publier une version. **Toute modification de `nginx.conf` doit etre reportee
# ici.**
#
# Ce qui est refuse, et pourquoi. Sur une demonstration, les identifiants sont
# publies : tout visiteur est administrateur. Or deux capacites d'administration
# sont dangereuses quand celui qui les detient n'est pas de confiance.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 32m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Refus propres a la demonstration ------------------------------------

    # Televersement de pieces jointes.
    #
    # Le controle de type accepte PNG, JPEG, GIF et WebP — ce qu'il faut pour un
    # ticket, et exactement le vecteur d'une image proscrite deposee sur un
    # service ouvert a tous. La remise a zero horaire efface le fichier, mais une
    # adresse partagee pendant l'heure fonctionne. L'exposition juridique porte
    # sur le nom de domaine, pas sur l'auteur du depot.
    #
    # La lecture reste autorisee : le jeu de demonstration n'a pas de piece
    # jointe, la liste s'affiche vide, et l'ecran reste visible.
    location ~ ^/api/documents/items/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Annuaires LDAP et collecteurs de courriel.
    #
    # Les deux se configurent avec un hote et un port libres, et se declenchent
    # a la demande. C'est une requete sortante arbitraire depuis le serveur :
    # de quoi sonder le reseau interne de la machine — les autres conteneurs,
    # les services d'administration, les adresses de metadonnees. La lecture
    # reste ouverte pour que les ecrans se visitent.
    location ~ ^/api/(admin/directories|mail-collectors)(/|$) {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Identique a nginx.conf a partir d'ici -------------------------------

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
