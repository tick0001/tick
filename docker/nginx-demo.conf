# Refus propres a une demonstration publique.
#
# Monte dans `/etc/nginx/tick-extra/` du conteneur `web` par
# `compose.demo.yaml`, et repris par le `include` de `nginx.conf`. Ce fichier
# ne contient **que** les differences : plus de copie de la configuration de
# base, donc plus de derive possible entre les deux.
#
# Exige une image `0.1.4` ou plus recente — les precedentes n'ont pas le point
# d'extension, et ce fichier y serait simplement ignore.
#
# Sur une demonstration, les identifiants sont publies : tout visiteur est
# administrateur. Deux capacites deviennent alors dangereuses.

# Televersement de pieces jointes.
#
# Le controle de type accepte PNG, JPEG, GIF et WebP — ce qu'il faut pour un
# ticket, et exactement le vecteur d'une image proscrite deposee sur un service
# ouvert a tous. La remise a zero horaire efface le fichier, mais une adresse
# partagee pendant l'heure fonctionne, et l'exposition juridique porte sur le
# nom de domaine.
#
# La lecture reste autorisee : la liste s'affiche vide, et l'ecran reste
# visible.
location ~ ^/api/documents/items/ {
    limit_except GET HEAD {
        deny all;
    }
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Annuaires LDAP et collecteurs de courriel.
#
# Les deux se configurent avec un hote et un port libres, et se declenchent a la
# demande. `ALLOW_PRIVATE_OUTBOUND=false` refuse deja les reseaux internes cote
# application ; ce refus-ci ferme aussi les adresses publiques, qu'une
# demonstration n'a aucune raison de joindre.
location ~ ^/api/(admin/directories|mail-collectors)(/|$) {
    limit_except GET HEAD {
        deny all;
    }
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
