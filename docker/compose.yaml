name: tick

services:
  postgres:
    image: postgres:18-alpine
    container_name: tick-postgres
    restart: unless-stopped
    # `random_page_cost` : PostgreSQL suppose par defaut un disque a plateaux,
    # ou une lecture au hasard coute quatre fois une lecture sequentielle. Sur
    # un SSD le rapport est proche de un, et la valeur par defaut pousse le
    # planificateur a balayer des tables entieres plutot qu'a suivre un index.
    #
    # Mesure sur cinquante mille tickets, banc d'essai complet, 50 connexions
    # simultanees (voir apps/charge) :
    #
    #   liste filtree par statut   p95 663 ms -> 247 ms,  95 -> 233 req/s
    #   recherche par titre        p95 1182 ms -> 796 ms, 52 -> 76 req/s
    #   indicateurs                p95 1384 ms -> 1000 ms, 42 -> 60 req/s
    #
    # Les six scenarios progressent, aucun ne regresse. **A remonter a 4 si les
    # donnees vivent sur un disque a plateaux**, ou la valeur par defaut est la
    # bonne.
    command: ['postgres', '-c', 'random_page_cost=1.1']
    environment:
      POSTGRES_USER: tick
      POSTGRES_PASSWORD: tick
      POSTGRES_DB: tick
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 stocke les donnees dans un sous-dossier par version majeure :
      # le volume se monte sur /var/lib/postgresql, plus sur .../data comme avant.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tick -d tick']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: tick-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: tick-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

  # Serveur de messagerie complet pour le collecteur entrant.
  #
  # Mailpit n'expose que SMTP : il recoit tout et montre bien, mais ne sait pas
  # etre relu en IMAP, ce dont le collecteur a precisement besoin. GreenMail
  # apporte SMTP **et** IMAP dans un seul conteneur, avec creation de boite a la
  # volee — l'authentification est desactivee, ce qui est acceptable pour une
  # dependance de test qui n'est jamais deployee.
  #
  # Les deux cohabitent a dessein : Mailpit reste la destination des envois
  # sortants, ou l'on inspecte ce que l'outil produit ; GreenMail est la boite
  # d'arrivee, ou l'on depose ce qu'il doit lire.
  greenmail:
    image: greenmail/standalone:2.1.13
    container_name: tick-greenmail
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled
    ports:
      - '3025:3025'
      - '3143:3143'

  # Annuaire de developpement et d'integration.
  #
  # osixia/openldap n'est plus maintenu, ce qui est acceptable pour une
  # dependance de test : elle n'est jamais deployee. Elle reste la reference de
  # fait pour amorcer un annuaire par fichier LDIF, ce dont depend la
  # reproductibilite des tests.
  #
  # Le mode `search` de decouverte des groupes est ici obligatoire : OpenLDAP
  # n'expose pas `memberOf` sans surcouche, contrairement a Active Directory.
  openldap:
    image: osixia/openldap:1.5.0
    container_name: tick-openldap
    restart: unless-stopped
    command: ['--copy-service', '--loglevel', 'warning']
    environment:
      LDAP_ORGANISATION: Tick
      LDAP_DOMAIN: exemple.fr
      LDAP_ADMIN_PASSWORD: admin
      LDAP_CONFIG_PASSWORD: config
      LDAP_REMOVE_CONFIG_AFTER_SETUP: 'true'
    ports:
      # 1389 plutot que 389 : port non privilegie, et aucun conflit avec un
      # annuaire deja installe sur la machine.
      - '1389:389'
    volumes:
      - ./openldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
    healthcheck:
      test:
        - CMD-SHELL
        - ldapsearch -x -H ldap://localhost -b dc=exemple,dc=fr -D "cn=admin,dc=exemple,dc=fr" -w admin > /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  postgres-data:
  redis-data:
  openldap-data:
  openldap-config:
