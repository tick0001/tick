name: tick

services:
  postgres:
    image: postgres:18-alpine
    container_name: tick-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tick
      POSTGRES_PASSWORD: tick
      POSTGRES_DB: tick
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18 stocke les donnees dans un sous-dossier par version majeure :
      # le volume se monte sur /var/lib/postgresql, plus sur .../data comme avant.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tick -d tick']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: tick-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: tick-mailpit
    restart: unless-stopped
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
  redis-data:
