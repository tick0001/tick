# Service de l'interface, et relais vers l'API.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Les pièces jointes et les exports peuvent être volumineux ; la limite par
    # défaut de nginx est d'un mégaoctet, ce qui rejetterait un simple journal
    # d'incident joint à un ticket. L'API applique sa propre limite, plus
    # basse : celle-ci ne fait que ne pas être le maillon qui refuse en premier.
    client_max_body_size 32m;

    # En-têtes de sécurité minimaux. Pas de politique de contenu ici : elle
    # dépend de ce que les plugins chargent, et une politique trop stricte posée
    # à l'aveugle casserait l'interface au premier plugin installé.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Relais vers l'API.
    #
    # Même origine que l'interface, à dessein : le cookie de session est
    # `httpOnly` et `SameSite`, et ne voyagerait pas entre deux domaines.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un export PDF sur un large périmètre dépasse la minute par défaut.
        proxy_read_timeout 300s;
    }

    # Les fichiers versionnés par empreinte ne changent jamais sous le même
    # nom : les mettre en cache pour un an est sans risque, et c'est ce qui
    # rend le second chargement instantané.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Point d'extension.
    #
    # Un deploiement peut deposer ici des regles supplementaires sans avoir a
    # recopier ce fichier : la demonstration publique s'en sert pour refuser
    # deux familles d'ecriture. Le motif ne correspondant a rien dans une
    # installation ordinaire, nginx l'ignore sans se plaindre.
    #
    # Place avant le repli sur l'index, mais l'ordre importe peu : une
    # `location` en expression reguliere est evaluee avant une `location` par
    # prefixe, quel que soit l'ordre du fichier.
    include /etc/nginx/tick-extra/*.conf;

    # Repli sur l'index.
    #
    # Les routes de l'application n'existent pas sur le disque : `/tickets/42`
    # est traité par le routeur du navigateur. Sans ce repli, un rechargement
    # de page — ou un lien partagé — renverrait une 404.
    location / {
        try_files $uri $uri/ /index.html;

        # L'index, lui, ne se met pas en cache : c'est lui qui désigne les
        # empreintes des fichiers, et un index périmé sert indéfiniment
        # l'ancienne version.
        add_header Cache-Control "no-cache";
    }
}
