# En-têtes de sécurité de l'interface.
#
# Inclus au niveau du serveur ET dans chaque `location` qui pose ses propres
# en-têtes. nginx n'hérite des `add_header` du niveau supérieur que si le niveau
# courant n'en déclare aucun : un simple `Cache-Control` dans une `location`
# suffisait à retirer tous ceux-ci — et c'était le cas des pages elles-mêmes,
# servies sans `X-Frame-Options`.
#
# Politique de contenu : tout vient de la même origine. Les extensions chargent
# leur interface depuis `/api/plugins/…`, donc la même origine aussi. Les styles
# admettent `'unsafe-inline'` pour la couleur de fond posée dans `index.html`
# avant la feuille de style ; les scripts, eux, n'admettent rien d'autre que
# des fichiers servis ici. Une installation qui a besoin d'une autre politique
# remplace ce fichier par un montage.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Frame-Options SAMEORIGIN always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS seulement quand le relais TLS annonce HTTPS : envoyé sur une installation
# servie en clair, il n'aurait aucun effet, mais un navigateur qui le reçoit en
# HTTPS refuse ensuite le clair pendant un an. Sans `includeSubDomains` : le
# domaine parent peut héberger d'autres services, qui ne sont pas les nôtres.
add_header Strict-Transport-Security $tick_hsts always;
