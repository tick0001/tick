name: Archives

# Archives de version, pour les installations sans conteneur.
#
# Les images Docker ne suffisent pas : beaucoup d'environnements d'entreprise
# interdisent un moteur de conteneurs sur un serveur. Ces archives sont
# autonomes — code compilé et `node_modules` inclus — pour qu'un serveur de
# production n'ait jamais besoin de la chaîne de construction.
#
# Une archive par plateforme, et ce n'est pas du zèle : `@node-rs/argon2` est un
# module natif. Un `node_modules` fabriqué sur une plateforme ne démarre pas sur
# une autre, et l'archive musl d'Alpine échoue sur toute distribution en glibc.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à empaqueter'
        required: true
  # Appelé par « Publication ». Voir le commentaire de `images.yml` : une
  # étiquette poussée par un workflow n'en déclenche aucun autre.
  workflow_call:
    inputs:
      etiquette:
        description: 'Étiquette à publier, « v » compris'
        type: string
        required: true

concurrency:
  # Voir `images.yml` : le prefixe separe les deux appels de « Publication ».
  group: archives-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  construire:
    name: ${{ matrix.cible }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner glibc : couvre Debian, Ubuntu, RHEL, Rocky, SUSE. Les
          # distributions musl passent par les images Docker, qui sont bâties
          # sur Alpine.
          - os: ubuntu-latest
            cible: linux-x64
          - os: windows-latest
            cible: win-x64

    steps:
      - uses: actions/checkout@v7
        with:
          # Appelé depuis une pull request, `github.ref` designe la fusion
          # d'essai, pas l'etiquette qu'on publie.
          ref: ${{ inputs.etiquette || github.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        shell: bash
        # L'étiquette `v0.1.0` désigne la version `0.1.0` : le préfixe sert au
        # déclenchement, pas au nom des fichiers. Il est retiré des deux sources,
        # sans quoi un déclenchement manuel produit des archives dont le nom
        # diffère de celles d'une vraie version.
        run: |
          numero="${{ inputs.etiquette }}"
          [ -n "$numero" ] || numero="${{ inputs.version }}"
          [ -n "$numero" ] || numero="$GITHUB_REF_NAME"
          echo "numero=${numero#v}" >> "$GITHUB_OUTPUT"

          # Un declenchement manuel empaquette sans creer de version : les
          # archives restent attachees a l'execution.
          publication=false
          case "$GITHUB_REF" in refs/tags/v*) publication=true ;; esac
          [ -z "${{ inputs.etiquette }}" ] || publication=true
          echo "publication=$publication" >> "$GITHUB_OUTPUT"

      # Garde-fou. La route de sante lit sa version dans le manifeste de l'API.
      # Si l'etiquette et le manifeste divergent, l'installation annonce une
      # version qui n'est pas la sienne — exactement le defaut que cette lecture
      # remplace. Mieux vaut refuser de publier que publier un mensonge.
      - name: Concordance de la version
        if: steps.version.outputs.publication == 'true'
        shell: bash
        env:
          ATTENDUE: ${{ steps.version.outputs.numero }}
        run: |
          manifeste=$(node -p "require('./apps/api/package.json').version")
          if [ "$manifeste" != "$ATTENDUE" ]; then
            echo "::error::L'etiquette annonce $ATTENDUE, le manifeste apps/api/package.json dit $manifeste."
            exit 1
          fi

      - name: Construction
        run: pnpm --filter @tick/api... build

      # L'interface est un ensemble de fichiers statiques, identique partout :
      # une seule archive, construite sur le runner Linux.
      #
      # Elle est construite ICI, avant `pnpm deploy --prod`, et l'ordre n'est pas
      # indifferent : `--prod` fait basculer l'espace de travail en mode
      # production, et la commande pnpm suivante en purge les devDependencies.
      # Construire l'interface apres, c'est la construire sans TypeScript ni Vite.
      - name: Interface
        if: runner.os == 'Linux'
        run: |
          pnpm --filter @tick/web build
          tar czf tick-web-${{ steps.version.outputs.numero }}.tar.gz -C apps/web/dist .

      # `pnpm deploy` produit une arborescence autonome : les dépendances
      # d'espace de travail y sont recopiées plutôt que liées, ce qui rend
      # l'ensemble transportable sur une machine qui n'a pas le monorepo.
      #
      # `node-linker=hoisted` n'est pas un detail de gout. Par defaut, pnpm place
      # chaque dependance dans `.pnpm/` et pose un lien symbolique a la racine de
      # `node_modules`. Une archive en contient alors des centaines, et Windows
      # ne cree pas de lien symbolique sans mode developpeur ni droits
      # d'administration : l'extraction produit un `node_modules` vide de tout ce
      # qui compte, et l'API ne demarre pas. Un arbre aplati n'a que des dossiers
      # reels, donc s'extrait partout.
      - name: Arborescence de déploiement
        run: pnpm --filter @tick/api --prod deploy --legacy --config.node-linker=hoisted deploiement

      # `pnpm deploy` recopie tout le dossier du paquet, sources comprises. Une
      # installation de production n'a que faire des `.ts`, des tsconfig et de la
      # configuration de test.
      - name: Élagage
        shell: bash
        run: rm -rf deploiement/src deploiement/tsconfig*.json deploiement/*.tsbuildinfo deploiement/vitest.* deploiement/.turbo deploiement/coverage

      - name: Archive (tar.gz)
        if: runner.os == 'Linux'
        run: tar czf tick-api-${{ steps.version.outputs.numero }}-${{ matrix.cible }}.tar.gz -C deploiement .

      - name: Archive (zip)
        if: runner.os == 'Windows'
        shell: pwsh
        # `Compress-Archive` met plusieurs minutes sur les 17 000 fichiers de
        # l'arborescence, pour une archive cinq fois plus grosse. `tar` est fourni
        # avec Windows et produit le meme zip en une dizaine de secondes.
        run: tar.exe -a -cf tick-api-${{ steps.version.outputs.numero }}-${{ matrix.cible }}.zip -C deploiement .

      - uses: actions/upload-artifact@v7
        with:
          name: archives-${{ matrix.cible }}
          path: |
            tick-api-*.tar.gz
            tick-api-*.zip
            tick-web-*.tar.gz
          if-no-files-found: error

  publier:
    name: Publication
    needs: construire
    runs-on: ubuntu-latest
    # Rien à publier sur un déclenchement manuel : les archives restent
    # attachées à l'exécution, téléchargeables sans créer de version.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.etiquette

    permissions:
      # Seule permission d'écriture accordée : créer la version et y joindre les
      # archives. Le workflow ne peut pas modifier le dépôt.
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: archives

      # `gh` est préinstallé sur les runners : pas d'action tierce à auditer ni
      # à épingler pour une opération que la ligne de commande fait en un appel.
      - name: Version GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Appelé depuis une pull request, `github.ref_name` nomme la branche.
          ETIQUETTE: ${{ inputs.etiquette || github.ref_name }}
        run: |
          gh release create "$ETIQUETTE" \
            --title "$ETIQUETTE" \
            --generate-notes \
            archives/*/* \
          || gh release upload "$ETIQUETTE" archives/*/* --clobber
