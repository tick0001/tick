name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: tick
          POSTGRES_PASSWORD: tick
          POSTGRES_DB: tick
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tick -d tick"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://tick:tick@localhost:5432/tick
      # Role applicatif distinct : c'est lui qui subit le Row-Level Security.
      # Reutiliser le role proprietaire ferait passer les tests d'isolation
      # sans rien verifier. Le role est cree par la premiere migration.
      DATABASE_APP_URL: postgres://tick_app:tick_app@localhost:5432/tick
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: secret-de-test-integration

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Migrations
        run: pnpm --filter @tick/db db:migrate

      - name: Format
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
