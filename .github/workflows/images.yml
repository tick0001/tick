name: Images

# Publication des images sur GitHub Container Registry.
#
# Déclenchée par une étiquette de version, jamais par un simple `push` sur
# `main` : une image publiée est une image que quelqu'un peut déployer, et
# republier `latest` à chaque commit ferait tourner en production du code qui
# n'a pas été désigné comme une version.
#
# Le déclenchement manuel existe pour reconstruire une version sans avoir à
# déplacer son étiquette.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      etiquette:
        description: 'Étiquette à republier, « v » compris'
        required: true
  # Appelé par « Publication », qui étiquette la fusion d'une branche
  # `release/<version>` dans `main`.
  #
  # Une étiquette poussée par un workflow ne déclenche aucun autre workflow —
  # GitHub l'interdit pour éviter les récursions, et le jeton par défaut n'y
  # peut rien. Sans ce point d'entrée, publier depuis une fusion exigerait un
  # jeton personnel, c'est-à-dire un secret de plus à faire tourner.
  workflow_call:
    inputs:
      etiquette:
        description: 'Étiquette à publier, « v » compris'
        type: string
        required: true

concurrency:
  # Prefixe litteral : appele par un autre workflow, `github.workflow`
  # nomme l'appelant, et les deux appels tomberaient dans le meme groupe.
  group: images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRE: ghcr.io

jobs:
  publier:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Seule permission d'écriture accordée : le jeton peut publier des
      # paquets, rien d'autre. Un jeton plus large n'apporterait rien et
      # donnerait à un workflow compromis de quoi réécrire le dépôt.
      packages: write

    strategy:
      fail-fast: false
      # Les deux images se construisent en parallele. Elles etaient en serie
      # parce que deux constructions simultanees reservaient la meme cle de
      # cache et que la seconde echouait — mais une reservation est une
      # ecriture, et ce workflow n'ecrit plus dans le cache. Voir plus bas.
      matrix:
        include:
          # `scope` reprend les portees qu'ecrit l'integration continue, et
          # c'est la seule raison de ce champ. Voir plus bas.
          - image: tick-api
            dockerfile: docker/api.Dockerfile
            scope: api
          - image: tick-web
            dockerfile: docker/web.Dockerfile
            scope: web

    steps:
      - uses: actions/checkout@v7
        with:
          # Appelé depuis une pull request, `github.ref` designe la fusion
          # d'essai, pas l'etiquette qu'on publie.
          ref: ${{ inputs.etiquette || github.ref }}

      # Trois declencheurs, une seule version. L'etiquette `v0.1.6` designe la
      # version `0.1.6` : le prefixe sert au declenchement, pas au nom des
      # images.
      - name: Version
        id: version
        shell: bash
        run: |
          numero="${{ inputs.etiquette }}"
          [ -n "$numero" ] || numero="$GITHUB_REF_NAME"
          echo "numero=${numero#v}" >> "$GITHUB_OUTPUT"

      # Garde-fou. La route de sante lit sa version dans le manifeste de l'API.
      # Si l'etiquette et le manifeste divergent, l'installation annonce une
      # version qui n'est pas la sienne — exactement le defaut que cette lecture
      # remplace. Mieux vaut refuser de publier que publier un mensonge.
      - name: Concordance de la version
        shell: bash
        env:
          ATTENDUE: ${{ steps.version.outputs.numero }}
        run: |
          manifeste=$(node -p "require('./apps/api/package.json').version")
          if [ "$manifeste" != "$ATTENDUE" ]; then
            echo "::error::L'etiquette annonce $ATTENDUE, le manifeste apps/api/package.json dit $manifeste."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Authentification au registre
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          # Jeton fourni par GitHub à chaque exécution : aucun secret à créer,
          # à faire tourner, ni à révoquer.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRE }}/${{ github.repository_owner }}/${{ matrix.image }}
          # `value=` plutot que la lecture du ref : appele depuis une pull
          # request, `github.ref` ne porte aucune version a extraire.
          #
          # Les trois declencheurs publient la meme chose, le manuel compris :
          # il sert a republier une version dont la construction a echoue, et
          # une republication partielle serait pire qu'aucune.
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.numero }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.numero }}
            type=raw,value=latest

      - name: Construction et publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # **Lecture seule, sur les portees de l'integration continue.**
          #
          # Ce workflow ne peut pas ecrire dans le cache. Appele par
          # « Publication », il tourne sur la fermeture d'une pull request, et
          # GitHub lui accorde un jeton en lecture : le journal l'annonce des la
          # preparation du travail, `Cache mode: read`. L'export echouait donc a
          # chaque version, et `ignore-error` le taisait.
          #
          # Il ne lisait rien non plus. L'integration continue ecrit sous les
          # portees `api` et `web` ; ce workflow cherchait sous `tick-api` et
          # `tick-web`, qu'aucun travail n'a jamais remplies. Aucune etape de la
          # 0.1.9 n'a ete servie par le cache.
          #
          # Une publication vise `main`, et peut donc lire ce que l'integration
          # continue y a ecrit a la fusion precedente : les couches de base et
          # les paquets systeme y sont presque toujours, meme quand les
          # dependances ont change entre deux versions.
          cache-from: type=gha,scope=${{ matrix.scope }}
