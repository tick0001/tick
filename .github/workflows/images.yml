name: Images

# Publication des images sur GitHub Container Registry.
#
# Déclenchée par une étiquette de version, jamais par un simple `push` sur
# `main` : une image publiée est une image que quelqu'un peut déployer, et
# republier `latest` à chaque commit ferait tourner en production du code qui
# n'a pas été désigné comme une version.
#
# Le déclenchement manuel existe pour reconstruire une version sans avoir à
# déplacer son étiquette.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Étiquette à poser sur les images'
        required: true
        default: 'latest'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRE: ghcr.io

jobs:
  publier:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Seule permission d'écriture accordée : le jeton peut publier des
      # paquets, rien d'autre. Un jeton plus large n'apporterait rien et
      # donnerait à un workflow compromis de quoi réécrire le dépôt.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tick-api
            dockerfile: docker/api.Dockerfile
          - image: tick-web
            dockerfile: docker/web.Dockerfile

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Authentification au registre
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRE }}
          username: ${{ github.actor }}
          # Jeton fourni par GitHub à chaque exécution : aucun secret à créer,
          # à faire tourner, ni à révoquer.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquettes
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRE }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Construction et publication
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Le cache est porté par le registre : sans lui, chaque publication
          # réinstalle toutes les dépendances depuis zéro, ce qui coûte
          # plusieurs minutes pour un résultat identique.
          cache-from: type=gha
          cache-to: type=gha,mode=max
