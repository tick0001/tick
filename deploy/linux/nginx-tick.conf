# Site nginx de Tick& — installation nue.
#
# Installation : /etc/nginx/sites-available/tick (Debian/Ubuntu)
#                /etc/nginx/conf.d/tick.conf     (RHEL/Rocky/SUSE)
# Voir docs/16-installation-linux.md.
#
# Ce fichier ne porte pas de TLS : il attend soit un terminateur en amont, soit
# l'ajout d'un bloc `listen 443 ssl` par certbot. Servir ce site tel quel sur
# une adresse publique fait voyager les mots de passe en clair.

# HSTS quand la requête est arrivée en HTTPS, ici — certbot — ou sur un
# terminateur en amont qui l'annonce. En clair, l'en-tête n'aurait aucun effet.
map "$scheme:$http_x_forwarded_proto" $tick_hsts {
    ~^https:  "max-age=31536000";
    ~:https$  "max-age=31536000";
    default   "";
}

server {
    listen 80;
    server_name assistance.exemple.fr;

    # Le build de l'interface, décompressé depuis tick-web.tar.gz.
    root /var/www/tick;
    index index.html;

    # Les pièces jointes et les exports peuvent être volumineux ; la limite par
    # défaut de nginx est d'un mégaoctet, ce qui rejetterait un simple journal
    # d'incident joint à un ticket. L'API applique sa propre limite, plus
    # basse : celle-ci ne fait que ne pas être le maillon qui refuse en premier.
    client_max_body_size 32m;

    # En-têtes de sécurité, **répétés à l'identique** dans chaque `location`
    # qui pose ses propres en-têtes. nginx n'hérite des `add_header` du niveau
    # supérieur que si le niveau courant n'en déclare aucun : un simple
    # `Cache-Control` suffisait à les retirer des pages elles-mêmes.
    #
    # Politique de contenu : tout vient de la même origine, y compris
    # l'interface des extensions, servie sous `/api/plugins/`. Les styles
    # admettent `'unsafe-inline'` pour la couleur de fond posée dans
    # `index.html` ; les scripts, rien d'autre que des fichiers servis ici.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security $tick_hsts always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Relais vers l'API, sur la boucle locale.
    #
    # Même origine que l'interface, à dessein : le cookie de session est
    # `httpOnly` et `SameSite`, et ne voyagerait pas entre deux domaines.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un export PDF sur un large périmètre dépasse la minute par défaut.
        proxy_read_timeout 300s;
    }

    # Les fichiers versionnés par empreinte ne changent jamais sous le même
    # nom : les mettre en cache pour un an est sans risque, et c'est ce qui
    # rend le second chargement instantané.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $tick_hsts always;
    }

    # Repli sur l'index.
    #
    # Les routes de l'application n'existent pas sur le disque : `/tickets/42`
    # est traité par le routeur du navigateur. Sans ce repli, un rechargement
    # de page — ou un lien partagé — renverrait une 404.
    location / {
        try_files $uri $uri/ /index.html;

        # L'index, lui, ne se met pas en cache : c'est lui qui désigne les
        # empreintes des fichiers, et un index périmé sert indéfiniment
        # l'ancienne version.
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $tick_hsts always;
    }
}
